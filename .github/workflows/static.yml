name: static
on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    container: golang:1.25-alpine
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache make git curl build-base npm
          apk add --no-cache \
          curl \
          gcc \
          g++ \
          musl-dev \
          build-base \
          libc6-compat
          apk add --no-cache \
          runuser \
          git \
          gcompat \
          openssh-client \
          rsync \
          npm
          git config --system --add safe.directory '*'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Restore golang cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-golang-repository
        with:
          path: |
            /go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-
      - name: Install Hugo
        run: |
          HUGO_VERSION=$(grep ^HUGO_VERSION netlify.toml | tail -n 1 | cut -d '=' -f 2 | tr -d " \"\n")
          echo "HUGO_VERSION=$HUGO_VERSION"
          curl -L https://github.com/gohugoio/hugo/archive/refs/tags/v${HUGO_VERSION}.tar.gz | tar -xz
          cd "hugo-${HUGO_VERSION}"
          go install --tags extended
      - name: Install PostCSS dependencies
        run: npm install -D autoprefixer postcss-cli
      - name: Initialize modules
        run: make module-init
      - name: Build API reference
        run: make api-reference
      - name: Patch docs theme font URL
        run: |
          sed -i "s|https://fonts.googleapis.com/css\?family=|/css/fonts-open-sans.css?family=|" ./api-ref-generator/themes/docsy/assets/scss/_variables.scss
      - name: Install dependencies and build site
        run: |
          npm ci
          hugo --minify --environment development
      - name: "Save golang cache"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.cache-golang-repository.outputs.cache-hit != 'true'
        with:
          path: |
            /go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
      - name: Patch main.css font URL
        run: |
          sed -i "s#https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,700,700i&display=swap#/css/fonts-open-sans.css#" ./public/scss/main.css
      - name: Patch homepage video banner image URL
        run: |
          sed -i "s#https://kubernetes.io/_common-resources/images/kub_video_banner_homepage.jpg#/kub_video_banner_homepage.jpg#" ./public/index.html
          sed -i "s#https://kubernetes.io/zh-cn/_common-resources/images/kub_video_banner_homepage.jpg#/kub_video_banner_homepage.jpg#" ./public/zh-cn/index.html
      - name: Count output files
        run: |
          find public -type f | wc -l
      - name: Show output directory sizes
        run: |
          du -h -d1 public
      - name: Upload full artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-full
          path: |
            public
      - name: Remove non-target language directories
        run: |
          rm -rf public/de
          rm -rf public/es
          rm -rf public/fr
          rm -rf public/hi
          rm -rf public/id
          rm -rf public/it
          rm -rf public/ja
          rm -rf public/ko
          rm -rf public/pl
          rm -rf public/pt-br
          rm -rf public/ru
          rm -rf public/uk
          rm -rf public/vi
      - name: Count output files
        run: |
          find public -type f | wc -l
      - name: Show output directory sizes
        run: |
          du -h -d1 public
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public
          path: |
            public
      - name: Publish to static site repository
        if: github.event_name != 'pull_request'
        env:
          STATIC_REPO_TOKEN: ${{ secrets.STATIC_REPO_TOKEN }}
          GIT_AUTHOR_NAME: 徐晓伟
          GIT_AUTHOR_EMAIL: xuxiaowei@xuxiaowei.com.cn
          GIT_COMMITTER_NAME: 徐晓伟
          GIT_COMMITTER_EMAIL: xuxiaowei@xuxiaowei.com.cn
        run: |
          set -eu
          BRANCH="${{ github.ref_name }}/public"
          git config --system credential.helper '!f() { echo username=x-access-token; echo password=$STATIC_REPO_TOKEN; }; f'
          rm -rf /tmp/static-site
          git clone --depth 1 https://github.com/xuxiaowei-com-cn/kubernetes-website-static.git /tmp/static-site
          cd /tmp/static-site
          git checkout --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p public
          cp -a "$GITHUB_WORKSPACE/public/." public/
          git add -A
          git commit -m "Publish static site for ${GITHUB_SHA}"
          # Best-effort compaction: --aggressive can exhaust the runner's
          # memory/disk on this repository without shrinking the pack.
          git gc --prune=now --quiet || echo "::warning::git gc failed, continuing"
          git push --force origin "$BRANCH"
          echo "Pushed public/ to kubernetes-website-static branch $BRANCH under public/"
      - name: Trigger deploy webhook
        if: github.event_name != 'pull_request'
        run: curl ${{ secrets.KUBERNETES_V1_37_WEBHOOK_URL }}
