name: static
on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    container: golang:1.23.1-alpine3.20
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache make git curl build-base npm tar grep
          git config --system --add safe.directory '*'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Restore golang cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-golang-repository
        with:
          path: |
            /go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-
      - name: "Restore node cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node-repository
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Hugo
        run: |
          HUGO_VERSION=$(grep ^HUGO_VERSION netlify.toml | tail -n 1 | cut -d '=' -f 2 | tr -d " \"\n")
          echo "HUGO_VERSION=$HUGO_VERSION"
          curl -L https://github.com/gohugoio/hugo/archive/refs/tags/v${HUGO_VERSION}.tar.gz | tar -xz
          cd "hugo-${HUGO_VERSION}"
          go install --tags extended
      - name: Initialize modules
        run: make module-init
      - name: Build API reference
        run: make api-reference

      - name: Install dependencies and build site
        run: |
          # --ignore-scripts skips the git-dependency preparation npm runs for
          # docsy (a github: dependency). That preparation installs docsy's own
          # devDependencies - hugo-extended among them - whose postinstall
          # downloads a glibc Hugo binary that cannot run in this Alpine
          # container. docsy ships its assets in the repository and has no
          # prepare/postinstall hook, so skipping the scripts is safe here.
          npm ci --ignore-scripts
          hugo --minify --environment development

      - name: Remove source maps from the build output
        run: |
          # Docsy turns source maps on for every non-production build (see
          # themes/docsy/layouts/partials/head-css.html), so Hugo emits
          # public/scss/main.css.map. Its sourcesContent carries the original
          # theme SCSS, where the Google Fonts URL is still an unresolved
          # build-time variable ($web-font-path), and browsers never load it.
          find public -name '*.map' -delete

      - name: "Save golang cache"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.cache-golang-repository.outputs.cache-hit != 'true'
        with:
          path: |
            /go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
      - name: "Save node cache"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.cache-node-repository.outputs.cache-hit != 'true'
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Patch external font, CDN and homepage banner image URLs in the build output
        run: |
          find public -type f \( -name '*.css' -o -name '*.html' -o -name '*.js' -o -name '*.svg' \) -exec sed -i \
            -e 's|https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,700,700i&display=swap|/css/fonts-open-sans.css|g' \
            -e 's|https://fonts.googleapis.com/css?family=Open+Sans|/css/fonts-open-sans.css|g' \
            -e 's|https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap|/css/fonts-rubik.css|g' \
            -e 's|https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap|/css/fonts-tajawal.css|g' \
            -e 's|https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v27.0.1/dist/font-face.css|/css/vazir/font-face.css|g' \
            -e 's|https://cdn.jsdelivr.net/npm/@open-iframe-resizer/core@latest/dist/index.js|/js/open-iframe-resizer-2.4.1.js|g' \
            -e 's|https://cdn.jsdelivr.net/npm/mermaid@9.3.0/dist/mermaid.min.js|/js/mermaid-9.3.0.min.js|g' \
            -e 's|https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css|/css/katex/katex-0.16.10.min.css|g' \
            -e 's|https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js|/js/katex-0.16.10.min.js|g' \
            -e 's|https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js|/js/katex-0.16.10-auto-render.min.js|g' \
            -e 's|https://cdn-images.mailchimp.com/embedcode/horizontal-slim-10_7.css|/embedcode/horizontal-slim-10_7.css|g' \
            -e 's|https://code.jquery.com/jquery-3.7.1.min.js|/js/jquery-3.7.1.min.js|g' \
            -e 's#https://kubernetes.io\(/[^/]*\)*/_common-resources/images/kub_video_banner_homepage.jpg#/kub_video_banner_homepage.jpg#g' \
            -e 's#https://kubernetes.xuxiaowei.com.cn\(/[^/]*\)*/_common-resources/images/kub_video_banner_homepage.jpg#/kub_video_banner_homepage.jpg#g' \
            -e 's|https://kubernetes.io/images/site-blocks/video_banner_homepage_XNZvGHlpJ_4.jpeg|/images/site-blocks/video_banner_homepage_XNZvGHlpJ_4.jpeg|g' \
            -e 's|https://kubernetes.xuxiaowei.com.cn/images/site-blocks/video_banner_homepage_XNZvGHlpJ_4.jpeg|/images/site-blocks/video_banner_homepage_XNZvGHlpJ_4.jpeg|g' {} +

      - name: Normalize _redirects for Cloudflare Pages
        run: |
          # Cloudflare Pages rejects the Netlify force flag ("301!"/"302!") and the 404
          # status, and counts every rule after the first dynamic rule towards its limit
          # of 100 dynamic rules. Drop what it rejects, strip the flag, and list the
          # static rules before the dynamic ones so nothing is silently skipped.
          printf '%s\n' \
            '# Generated from static/_redirects; normalized for Cloudflare Pages.' \
            '# Netlify-only "301!" suffixes and 404 statuses are removed, and static rules are listed before dynamic ones (CF Pages caps dynamic rules at 100).' \
            > public/_redirects.cf
          awk '
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            {
              line = $0
              sub(/[[:space:]]*![[:space:]]*$/, "", line)
              if (line ~ /[[:space:]]404[[:space:]]*$/) next
              if ($1 ~ /\*|:/) dyn[++dn] = line
              else             sta[++sn] = line
            }
            END {
              for (i = 1; i <= sn; i++) print sta[i]
              for (i = 1; i <= dn && i <= 100; i++) print dyn[i]
            }
          ' public/_redirects >> public/_redirects.cf
          mv public/_redirects.cf public/_redirects

      - name: Check Google Fonts URLs in the build output
        run: |
          if grep -r "fonts.googleapis.com" ./public; then
            echo "::error::Google Fonts URL found in the build output"
            exit 1
          fi
          echo "no Google Fonts URL found"

      - name: Check jsDelivr URLs in the build output
        run: |
          if grep -r "cdn.jsdelivr.net" ./public; then
            echo "::error::jsDelivr URL found in the build output"
            exit 1
          fi
          echo "no jsDelivr URL found"

      - name: Check code.jquery.com URLs in the build output
        run: |
          if grep -r "code.jquery.com" ./public; then
            echo "::error::code.jquery.com URL found in the build output"
            exit 1
          fi
          echo "no code.jquery.com URL found"

      - name: Check cdn-images.mailchimp.com URLs in the build output
        run: |
          if grep -r "cdn-images.mailchimp.com" ./public; then
            echo "::error::cdn-images.mailchimp.com URL found in the build output"
            exit 1
          fi
          echo "no cdn-images.mailchimp.com URL found"

      - name: Check cse.google.com URLs in the build output
        run: |
          if grep -r "cse.google.com" ./public; then
            echo "::error::cse.google.com URL found in the build output"
            exit 1
          fi
          echo "no cse.google.com URL found"

      - name: Check www.clarity.ms URL in the build output
        run: |
          if ! grep -r -q "www.clarity.ms" ./public; then
            echo "::error::www.clarity.ms URL not found in the build output"
            exit 1
          fi
          echo "www.clarity.ms URL found"

      - name: Check googletagmanager.com URLs in the build output
        run: |
          # The Kubernetes Google Analytics tag must never reach the built site,
          # not even inside an HTML comment (minify strips those anyway).
          if grep -r "googletagmanager.com" ./public; then
            echo "::error::googletagmanager.com URL found in the build output"
            exit 1
          fi
          echo "no googletagmanager.com URL found"

      - name: Check homepage video banner image URLs after patch
        env:
          BANNER_URL_PATTERN: 'https://(kubernetes\.io|kubernetes\.xuxiaowei\.com\.cn)(/[^/]*)*/_common-resources/images/kub_video_banner_homepage\.jpg'
        run: |
          if grep -rnE "$BANNER_URL_PATTERN" ./public; then
            echo "::error::homepage video banner image URL found in the build output"
            exit 1
          fi
          echo "no homepage video banner image URL found"

          # The rewrite points the banner at a self-hosted copy of the image, so the build
          # output has to contain that file and still reference it; otherwise the patched
          # URL is just a different broken link.
          if [ ! -f public/kub_video_banner_homepage.jpg ]; then
            echo "::error::public/kub_video_banner_homepage.jpg is missing from the build output"
            exit 1
          fi
          echo "public/kub_video_banner_homepage.jpg found in the build output"
          printf 'self-hosted homepage video banner image reference(s) in the build output: %s\n' "$(grep -rEo 'kub_video_banner_homepage\.jpg' ./public | wc -l | tr -d ' ')"

      - name: Check homepage video banner (video_banner_homepage_XNZvGHlpJ_4.jpeg) after patch
        env:
          POSTER_URL_PATTERN: 'https?://[^" ]*/images/site-blocks/video_banner_homepage_XNZvGHlpJ_4.jpeg'
        run: |
          if grep -rnE "$POSTER_URL_PATTERN" ./public; then
            echo "::error::absolute homepage video banner image URL found in the build output"
            exit 1
          fi
          if [ ! -f ./public/images/site-blocks/video_banner_homepage_XNZvGHlpJ_4.jpeg ]; then
            echo "::error::public/images/site-blocks/video_banner_homepage_XNZvGHlpJ_4.jpeg is missing from the build output"
            exit 1
          fi
          echo "homepage video banner image is referenced locally"
      - name: Count output files
        run: |
          find public -type f | wc -l
      - name: Show output directory sizes
        run: |
          du -h -d1 public
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public
          path: |
            public

      - name: Publish to static site repository
        if: github.event_name != 'pull_request'
        env:
          STATIC_REPO_TOKEN: ${{ secrets.STATIC_REPO_TOKEN }}
          GIT_AUTHOR_NAME: 徐晓伟
          GIT_AUTHOR_EMAIL: xuxiaowei@xuxiaowei.com.cn
          GIT_COMMITTER_NAME: 徐晓伟
          GIT_COMMITTER_EMAIL: xuxiaowei@xuxiaowei.com.cn
        run: |
          set -eu
          BRANCH="${{ github.ref_name }}/public"
          git config --system credential.helper '!f() { echo username=x-access-token; echo password=$STATIC_REPO_TOKEN; }; f'
          rm -rf /tmp/static-site
          git clone --depth 1 https://github.com/xuxiaowei-com-cn/kubernetes-website-static.git /tmp/static-site
          cd /tmp/static-site
          git checkout --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p public
          cp -a "$GITHUB_WORKSPACE/public/." public/
          git add -A
          git commit -m "Publish static site for ${GITHUB_SHA}"
          # Best-effort compaction: --aggressive can exhaust the runner's
          # memory/disk on this repository without shrinking the pack.
          git gc --prune=now --quiet || echo "::warning::git gc failed, continuing"
          git push --force origin "$BRANCH"
          echo "Pushed public/ to kubernetes-website-static branch $BRANCH under public/"
